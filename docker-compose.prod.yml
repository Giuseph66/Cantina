name: cantina

services:
  migrate:
    image: cantina/api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    environment:
      DATABASE_URL: file:/data/cantina.db
    volumes:
      - ./data:/data
    command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"

  api:
    image: cantina/api:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env.production
    environment:
      DATABASE_URL: file:/data/cantina.db
      NODE_ENV: production
      PORT: 3000
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase.json
    volumes:
      - ./data:/data
      - ./uploads:/app/apps/api/uploads
      - ./secrets/firebase.json:/run/secrets/firebase.json:ro
    ports:
      - "127.0.0.1:1205:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/catalog/categories').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      api:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run", "${CLOUDFLARE_TUNNEL_ID:?Set CLOUDFLARE_TUNNEL_ID}"]
    volumes:
      - ./deploy/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/cloudflared.json:/run/secrets/cloudflared.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
